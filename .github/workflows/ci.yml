name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      update_image_cache:
        description: "Set to true if the CI should update the Docker image cache"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  MAKE_JOBS: 2 # When building the Dockerfile, use 2 make jobs
  REGISTRY: ghcr.io

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title for Conventional Commits format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-validation:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    # Install the Rust toolchain from the toolchain.toml file.
    # This needs to manually be done before the rust cache is set up because
    # the cache is tied to the Rust version.
    - name: Install Rust toolchain
      run: rustup show
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Linting
      run: cargo clippy --locked -- -D warnings
    - name: Unit tests
      run: cargo test --bins --locked

  containerisation:
    timeout-minutes: 30
    needs: code-validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Set Docker Repo to lowercase
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "DOCKER_REPO=$REGISTRY/$REPO_LOWER" >> $GITHUB_ENV

    - name: Login to registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Build image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        target: ci-end-to-end
        load: true
        tags: ${{ env.DOCKER_REPO }}:latest
        cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache
        cache-to: ${{ inputs.update_image_cache && format('type=registry,ref={0}:buildcache,mode=max', env.DOCKER_REPO) || '' }}

    - name: Run end-to-end tests
      run: docker run -t ${{ env.DOCKER_REPO }}:latest cargo test --tests --release --locked
